name: Build desktop and mobile apps

on:
  push:
    branches: [main]
    paths: ['docs/**', 'apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    # نسخة من المكتبات جوه البرنامج علشان التطبيقات ما تعتمدش على مواقع تانية
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle libraries
        run: |
          mkdir -p /tmp/v && cd /tmp/v
          npm init -y >/dev/null
          npm i @supabase/supabase-js@2 esbuild >/dev/null
          echo "export * from '@supabase/supabase-js';" > entry.js
          npx esbuild entry.js --bundle --format=esm --platform=browser --minify --outfile=supabase.js
          curl -fsSL https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js -o xlsx.full.min.js
          mkdir -p $GITHUB_WORKSPACE/docs/js/vendor
          cp supabase.js xlsx.full.min.js $GITHUB_WORKSPACE/docs/js/vendor/
      - name: Bundle fonts (علشان البرنامج يشتغل من غير نت)
        run: |
          cd $GITHUB_WORKSPACE/docs && mkdir -p fonts
          curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
            "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" -o /tmp/g.css
          python3 - <<'PY'
          import re, urllib.request, os
          css = open('/tmp/g.css').read()
          for i, url in enumerate(sorted(set(re.findall(r'url\((https://[^)]+)\)', css)))):
              name = f'plex-{i}.woff2'
              urllib.request.urlretrieve(url, os.path.join('fonts', name))
              css = css.replace(url, '../fonts/' + name)
          open('css/fonts.css', 'w').write(css)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: site, path: docs }

  windows:
    needs: vendor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: site, path: docs }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build Alagamy.exe
        run: dotnet publish apps/windows/Alagamy.csproj -c Release -o out -p:Version=1.0.${{ github.run_number }}
      - name: Build AlagamySetup.exe (برنامج التسطيب)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile out/MicrosoftEdgeWebview2Setup.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyVersion=1.0.${{ github.run_number }}" apps/windows/setup/alagamy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "out/Alagamy*.exe" }

  android:
    needs: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: site, path: docs }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build APK
        run: |
          mkdir mobile && cd mobile
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 >/dev/null
          cp -r ../docs www && rm -f www/.nojekyll
          cat > capacitor.config.json <<'JSON'
          { "appId": "com.alagamy.accounts", "appName": "العجمي", "webDir": "www",
            "server": { "url": "https://engatoo-art.github.io/alagamy/", "errorPath": "index.html", "androidScheme": "https" },
            "android": { "backgroundColor": "#f4f6f1" } }
          JSON
          npx cap add android
          # أيقونة البرنامج
          cp -r ../apps/android/assets assets
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#154d31' --splashBackgroundColor '#f4f6f1'
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/Alagamy.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Alagamy.apk }

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Full package (كل ملفات البرنامج في ملف واحد)
        run: |
          mkdir -p pkg/Alagamy && cd pkg/Alagamy
          cp -r ../../src/supabase ../../src/apps ../../src/dev ../../src/README.md ../../src/README-AR.md .
          cp -r ../../dl/site site
          mkdir -p programs && cp ../../dl/windows/*.exe ../../dl/android/*.apk programs/
          cd .. && zip -qr ../Alagamy-full.zip Alagamy && cd .. && ls -la Alagamy-full.zip
      - name: Publish download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest dl/windows/AlagamySetup.exe dl/windows/Alagamy.exe dl/android/Alagamy.apk Alagamy-full.zip -R ${{ github.repository }} \
            --title "العجمي — آخر نسخة" \
            --notes "برنامج التسطيب للويندوز (AlagamySetup.exe)، ونسخة بتشتغل من غير تسطيب (Alagamy.exe)، وتطبيق الأندرويد (Alagamy.apk)، وكل ملفات البرنامج في ملف واحد (Alagamy-full.zip)."
